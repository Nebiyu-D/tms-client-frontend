<main class="enrollment-page">
  <header class="page-header">
    <p class="eyebrow">Enrollment overview</p>
    <h1>Enrollment Records</h1>
  </header>

  @if (store.isLoading()) {
    <p class="status-text">Loading enrollments...</p>
  }

  @if (store.error()) {
    <p class="error-message">{{ store.error() }}</p>
  }

  <section class="table-panel">
    <table mat-table [dataSource]="dataSource" matSort class="enrollment-table">
      <ng-container matColumnDef="studentName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Student</th>
        <td mat-cell *matCellDef="let row">{{ row.studentName }}</td>
      </ng-container>

      <ng-container matColumnDef="courseName">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Course</th>
        <td mat-cell *matCellDef="let row">{{ row.courseName }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let row">
          <span class="status-badge" [class]="row.status.toLowerCase()">
            {{ row.status }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let row">
          @if (row.status === 'Pending') {
            <button class="approve-button" (click)="store.approveEnrollment(row.id)">Approve</button>
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator
      [pageSizeOptions]="[10, 25, 50]"
      showFirstLastButtons
      aria-label="Select page of enrollments"
    ></mat-paginator>
  </section>
</main>
